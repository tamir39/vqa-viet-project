# Global configuration for Vietnamese VQA project
project_name: "vqa-viet-project"

# Hyperparameters
hyperparameters:
  batch_size: 16
  lr: 5.0e-5
  epochs: 10
  max_seq_length: 128
  weight_decay: 0.01

# Model configurations
# A1/A2: Baseline models
# B1/B2: Advanced models
models:
  A1:
    encoder_path: "path/to/A1/encoder"
    decoder_path: "path/to/A1/decoder"
  A2:
    encoder_path: "path/to/A2/encoder"
    fusion_path: "path/to/A2/fusion"
  B1:
    model_path: "path/to/B1/model"
  B2:
    model_path: "path/to/B2/model"

# Dataset paths
# Source data lives on Kaggle (phvngtngtm/foodlensvn) and is either:
#   - mounted at /kaggle/input/foodlensvn (Kaggle notebooks), or
#   - downloaded locally via `python scripts/fetch_dataset.py` to data/foodlensvn/
# build_dataset.py reads from <data_dir>, writes processed splits to <output_dir>.
dataset:
  data_dir: "data/foodlensvn"               # raw root: annotations/ + images/
  output_dir: "data/processed"              # processed splits + answer_vocab
  images_dir: "data/foodlensvn/images"      # used at training time
  image_variant: "squared"                  # squared|raw — annotation paths are <variant>/<split>/<file>
  train_path: "data/processed/annotations/train.json"
  val_path: "data/processed/annotations/val.json"
  test_path: "data/processed/annotations/test.json"
  answer_vocab: "data/processed/answer_vocab.json"

# Logging and Output
logging:
  log_dir: "reports/logs"
  checkpoint_dir: "reports/checkpoints"
